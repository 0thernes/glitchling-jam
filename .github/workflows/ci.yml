name: CI — Cross-Platform Verification, Exact Oracle, 6-Kernel Lean 4.35.0 & AMS-LaTeX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-check:
    name: Repo Health, Schema, Blueprint, JS Ladder & Python Oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python test/oracle/schema dependencies
        run: python -m pip install --quiet numpy pytest hypothesis pyyaml jsonschema
      - name: Repository health check (9/9 syntax, links, secrets, honesty guard, determinism, Bun ref-sim)
        run: node tools/check.mjs
      - name: Single-version parity, repo.yaml Draft 2020-12 JSON Schema, Palomar rules & identity hygiene
        run: python scripts/check_versions.py
      - name: Interactive Lean Proof Blueprint checkdecls fidelity gate
        run: python scripts/check_blueprint_decls.py
      - name: JS Verification Ladder (1,200 properties + negative + regressions + metamorphic + 8/8 killed mutants)
        run: npm run verify:ladder
      - name: Runnable examples smoke test
        run: npm run examples
      - name: Independent exact Python oracle, JS differential check & Lean static audit
        run: python scripts/verify_exact.py
      - name: Pytest + Hypothesis property-based oracle suite
        run: python -m pytest tests/test_oracle.py -v
      - name: Verbatim README #print axioms drift check (72 declarations)
        run: python scripts/check_readme_axioms.py
      - name: Verify offline citation audit & dual RFC 3161 (.tsr) + OpenTimestamps (.ots) proofs
        run: |
          python scripts/audit_citations.py --verify-offline
          python scripts/timestamp_checksums.py --verify-only
      - name: Verify cryptographic SHA-256 manifests (Linux)
        if: runner.os == 'Linux'
        run: |
          sha256sum -c CHECKSUMS.sha256
          sha256sum -c data/MANIFEST.sha256

  report-only-static:
    name: Report-Only Static Analysis, Secret Scan & Build Standard Audit (R1/R3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python static analyzers (report-only)
        continue-on-error: true
        run: python -m pip install --quiet ruff mypy numpy pytest hypothesis pyyaml jsonschema
      - name: Ruff static lint (report-only)
        continue-on-error: true
        run: ruff check reference scripts tests
      - name: Strict mypy type check (report-only)
        continue-on-error: true
        run: mypy --config-file pyproject.toml reference scripts tests
      - name: Secret scan via gitleaks (report-only)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Standard v1.2.0 90-item repo audit (report-only)
        continue-on-error: true
        run: bash scripts/audit-repo.sh .

  lean4-formal-audit:
    name: Lean 4.35.0 72-Decl Palomar Audit, lake check & 6-Kernel Comparator + Negative Tamper
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install elan, Lean 4.35.0 & bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          toolchain="$(tr -d '[:space:]' < lean/lean-toolchain)"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clean-build GlitchlingProofs, Challenge & Solution + audit 72 axioms + leanchecker
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake clean
          lake build GlitchlingProofs Challenge Solution
          lake env lean VerifyAxioms.lean | tee ../results/lean-audit-ci.log
          lake env leanchecker --fresh GlitchlingProofs
          lake env leanchecker --fresh Solution
          lake env leanchecker-paranoid --fresh Solution
          python3 - <<'PY'
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          count = 0
          for line in open("../results/lean-audit-ci.log", encoding="utf-8"):
              line = line.strip()
              if any(bad in line for bad in ("sorryAx", "Lean.ofReduceBool", "_native")):
                  raise SystemExit(f"ERROR: Forbidden axiom detected: {line}")
              if "depends on axioms:" in line:
                  count += 1
                  used = {t.strip() for t in line.split("[", 1)[1].rsplit("]", 1)[0].split(",") if t.strip()}
                  if not used.issubset(allowed):
                      raise SystemExit(f"ERROR: Forbidden axiom {used - allowed} in: {line}")
              elif "does not depend on any axioms" in line:
                  count += 1
          assert count >= 76, f"Expected >= 76 audited declarations, got {count}"
          print(f"PASS: All {count} Lean 4 declarations strictly within {sorted(allowed)} (or zero axioms).")
          PY
      - name: REQUIRED 6-kernel Palomar full-project check (lake check --paranoid inside bubblewrap)
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          lake check --paranoid | tee ../results/lean4-lake-check-ci.log
      - name: REQUIRED 6-kernel Palomar comparator (lake comparator --paranoid inside bubblewrap)
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          lake comparator --config comparator.json --paranoid | tee ../results/lean4-multi-kernel-ci.log
      - name: REQUIRED live negative false-theorem & sorry-tamper test
        shell: bash
        run: python3 scripts/test_lean_negative.py --with-comparator
      - name: Upload 6-kernel Lean verification log artifact
        uses: actions/upload-artifact@v4
        with:
          name: lean4-6kernel-verification-log
          path: |
            results/lean-audit-ci.log
            results/lean4-lake-check-ci.log
            results/lean4-multi-kernel-ci.log

  latex-manuscript-check:
    name: AMS-LaTeX Zero-Warning PDF & Standalone arXiv Tarball Check (Tectonic)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: Compile paper/main.tex & verify standalone arXiv tarball
        run: python scripts/package_dist.py --verify-only
      - name: Upload compiled manuscript PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Donahue_2026_glitchling_alife_verification
          path: dist/Donahue_2026_glitchling_alife_verification.pdf
