name: Release Frozen Artifacts, SHA256SUMS & Build Provenance

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Package & Publish Verified Release Assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python verification deps
        run: python -m pip install --quiet numpy pytest hypothesis
      - name: Verify JS ladder, examples, Python oracle & checksums prior to release
        run: |
          npm run verify:ladder
          npm run examples
          python scripts/verify_exact.py
          python scripts/check_readme_axioms.py
          sha256sum -c CHECKSUMS.sha256
          sha256sum -c data/MANIFEST.sha256
      - name: Stage release artifacts and compute SHA256SUMS
        run: |
          mkdir -p release-assets
          cp dist/Donahue_2026_glitchling_alife_verification.pdf release-assets/
          cp dist/arxiv_submission.tar.gz release-assets/
          cp results/lean_axioms.txt release-assets/
          cp results/summary.csv release-assets/
          cp results/perf-benchmarks.json release-assets/
          cp CHECKSUMS.sha256 release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS)
          cat release-assets/SHA256SUMS
      - name: Generate SLSA build provenance attestation for release artifacts
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            release-assets/Donahue_2026_glitchling_alife_verification.pdf
            release-assets/arxiv_submission.tar.gz
            release-assets/lean_axioms.txt
            release-assets/SHA256SUMS
      - name: Create or update GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Glitchling $TAG" \
              --notes-file CHANGELOG.md
          fi
