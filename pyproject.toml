[project]
name = "glitchling-jam-verification"
version = "2.2.0"
description = "Independent exact-arithmetic Python oracle, test suite, and figure pipeline for Glitchling"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
